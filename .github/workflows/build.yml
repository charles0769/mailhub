name: Build Release Packages

# 推送 tag（如 v1.0.1）或手动触发时，构建全平台安装包并上传到 GitHub Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop packages (Linux: deb/rpm/AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build desktop packages (Windows: nsis exe)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build desktop packages (macOS: dmg)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android platform
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/MailHub-1.0.0.apk || mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/MailHub-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MailHub-*.apk

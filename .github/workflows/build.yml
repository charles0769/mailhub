name: Build Release Packages

# - push 到 main / 手动触发：构建验证，产物在 Artifacts
# - push tag (v*)：构建 + 自动发 GitHub Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: "Build (Linux: deb/rpm/AppImage)"
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: "Build (Windows: NSIS exe)"
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: "Build (macOS: dmg)"
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p release-out
          cp dist/*.exe dist/*.deb dist/*.rpm dist/*.AppImage dist/*.dmg release-out/ 2>/dev/null || true
          ls -la release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: release-out/*
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Add Capacitor Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/debug/app-debug.apk release-out/MailHub-android.apk
          ls -la release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-android
          path: release-out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ desktop, android ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-packages
          merge-multiple: true

      - name: Show files
        run: ls -la all-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-packages/*
          generate_release_notes: true

services:
  mailhub:
    build: .
    container_name: mailhub
    restart: unless-stopped
    ports:
      - "18090:18090"
    volumes:
      - ./mailhub-data:/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18090/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
